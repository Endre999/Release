name: Publish DriveBridge APK

on:
  push:
    tags:
      - "drivebridge-reader-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "DriveBridgeReader-0.9.0-draft.apk#DriveBridge Reader 0.9.0-draft APK" \
            --title "DriveBridge Reader 0.9.0-draft" \
            --notes "Fejlesztői teszt-APK a telefonos ChatGPT-leirat és WhatsApp-piszkozat folyamathoz. Közvetlenül letölthető APK, ZIP-csomagolás nélkül. SHA-256: 215d0cd63d939bff6bae0e1a17160ca356a1c8239e0ad04211a72b0e51349ffd" \
            --prerelease
