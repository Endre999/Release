name: Publish DriveBridge APK

# A fő ágra kerülő apk/<verzió>/ mappából GitHub Release-t készít.
# Egy mappa tartalma: DriveBridge-<verzió>.apk, DriveBridge-<verzió>.apk.sha256,
# KIADASI-JEGYZET.md, és tetszőleges további kísérőfájl.
# Ha a verzióhoz már van Release, a mappát kihagyja.

on:
  push:
    branches: [main]
    paths:
      - "apk/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-drivebridge-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and publish missing APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in apk/*/; do
            version="$(basename "$dir")"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "::error::Érvénytelen verziómappa: $dir"
              exit 1
            fi
            tag="drivebridge-reader-v$version"
            apk="DriveBridge-$version.apk"
            notes="${dir}KIADASI-JEGYZET.md"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "A $tag kiadás már létezik, kihagyva."
              continue
            fi
            test -s "$dir$apk"
            test -s "$dir$apk.sha256"
            test -s "$notes"
            (cd "$dir" && sha256sum --check --strict "$apk.sha256")
            assets=()
            for file in "$dir"*; do
              if [[ "$file" != "$notes" ]]; then
                assets+=("$file")
              fi
            done
            release_type=()
            if [[ "$version" == *-* ]]; then
              release_type=(--prerelease)
            fi
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DriveBridge $version" \
              --notes-file "$notes" \
              "${release_type[@]}"
            echo "Közzétéve: $tag"
          done
